server:
  port: 8081 # 商品服务端口

spring:
  # H2数据库配置
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/h2db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    username: sa
    password: 123456
  # H2控制台配置（浏览器访问）
  h2:
    console:
      enabled: true
      path: /h2-console
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: none # 开发环境使用create-drop update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # 数据初始化
  sql:
    init:
      mode: always
      schema-locations: classpath*:schema.sql
      data-locations: classpath*:data.sql

# 暴露健康检查端口
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
